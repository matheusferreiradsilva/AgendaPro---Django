{% extends 'meuapp/base.html' %}

{% block conteudo %}
<div class="p-10 border-2 border-gray-700 bg-gray-800 rounded-lg shadow-md">
    <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        {{ form.profissional }}
        {{ form.data_hora }}
        {{ form.status }}
        <button class="bg-gray-50 border-2 p-1 rounded-full hover:bg-gray-200 hover:font-bold" type="submit">Salvar</button>
    </form>
</div>
{% endblock %}
